name: Plug-and-play manager checks

on:
  push:
    branches:
      - feat/plug-and-play-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build --release
