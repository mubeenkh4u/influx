name: Plug-and-play manager checks

on:
  push:
    branches:
      - feat/plug-and-play-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Build Influx core
        run: bun run build --release
      - name: Build Influx Manager
        run: bun run build:manager
      - name: Validate Linux helper executable
        run: dist/manager/bin/influx-manager-helper --help

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Electron runtime
        run: bun install --frozen-lockfile
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - name: Build core
        run: bun run build --release
      - name: Build manager
        run: bun run build:manager
      - name: Bundle Electron
        run: bun run package:manager
      - name: Smoke-test Linux dashboard in virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a dist/manager/packages/influx-manager-linux-x64/influx-manager --no-sandbox --smoke-test
      - name: Archive Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist/manager/packages
          tar -czf influx-manager-linux-x64.tar.gz influx-manager-linux-x64
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/manager/packages/influx-manager-win32-x64" -DestinationPath "dist/manager/packages/influx-manager-win32-x64.zip"
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: influx-manager-${{ runner.os }}
          path: |
            dist/manager/packages/*.tar.gz
            dist/manager/packages/*.zip
          if-no-files-found: error
